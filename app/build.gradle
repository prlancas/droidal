plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.gitlab.arturbosch.detekt'
}

android {
    namespace 'com.prlancas.droidal'
    compileSdk 35

    defaultConfig {
        applicationId "com.prlancas.droidal"
        // Bumped from 29 to 31 to satisfy LiteRT-LM (com.google.ai.edge.litertlm) minimum.
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // LiteRT-LM 0.10.0 ships Kotlin 2.3.0 metadata; AGP 8.13.0 pins us to
        // Kotlin 2.1.0. The skip flag lets the compiler read those classes
        // without erroring on the newer metadata version.
        freeCompilerArgs += '-Xskip-metadata-version-check'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }

    // JVM unit tests for the Kotlin business-logic in this module. Most of
    // Droidal's interesting code (TtsStreamer / MarkdownStore / the
    // conversation listen-with-retry policy / tool schemas) is plain
    // Kotlin and runs fine on the host JVM. `returnDefaultValues = true`
    // makes android.util.Log etc. return 0 instead of throwing the usual
    // "Method ... not mocked" error — keeps the tests dependency-light
    // (no Robolectric needed).
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

// Run JVM unit tests AND detekt as part of every debug build, so a
// `./gradlew :app:assembleDebug` (the day-to-day build) catches broken
// tests / new lint failures before the APK is produced.
afterEvaluate {
    tasks.named('assembleDebug').configure {
        dependsOn 'testDebugUnitTest', 'detekt'
    }
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$projectDir/config/detekt/detekt.yml"))
    baseline = file("$projectDir/config/detekt/baseline.xml")
    source.setFrom(files("src/main/java", "src/test/java", "src/androidTest/java"))
    parallel = true
    autoCorrect = false
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
    reports {
        html.required.set(true)
        xml.required.set(false)
        txt.required.set(false)
        sarif.required.set(false)
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
        implementation("androidx.startup:startup-runtime:1.1.1") {
            because("Force compatible version to avoid API 34 requirement")
        }
    }

    def camerax_version = "1.3.0-beta01"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-mlkit-vision:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation 'com.google.code.gson:gson:2.10.1'

    // WebSocket client for RobotWsClient (android_bridge.py communication).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // On-device LLM inference (mirrors Google AI Edge Gallery).
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.0'

    // Encrypted preferences for the Gemini API key and Hugging Face access token.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager-driven model downloader.
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Force compatible versions to avoid API 34 requirement
    implementation 'androidx.startup:startup-runtime:1.1.1'

    // Markdown renderer for the per-user MEMORY / USER / SKILL views in
    // SettingsActivity → LearningActivity. Compose-native, no XML interop.
    //
    // Pinned to 0.33.0 — this is the last release built against Compose
    // Multiplatform 1.7.x. From 0.34.0 onwards the library is compiled
    // against Compose Foundation 1.8.x, which calls a `BasicText`
    // overload (with the `TextAutoSize` parameter) that does not exist
    // in our Compose BOM 2024.12.01 (Compose Foundation 1.7.x). Using
    // 0.34.0+ throws NoSuchMethodError: BasicText-CL7eQgs at first
    // composition. 0.40.x additionally requires compileSdk 36 which we
    // don't bump from 35.
    implementation 'com.mikepenz:multiplatform-markdown-renderer-android:0.33.0'
    implementation 'com.mikepenz:multiplatform-markdown-renderer-m3:0.33.0'

    testImplementation 'junit:junit:4.13.2'
    // Coroutine test helpers — runTest, TestScope, UnconfinedTestDispatcher.
    // Used by the conversation policy + TtsStreamer + SuspendLatch tests
    // so we get a deterministic virtual clock and don't have to sleep in
    // tests.
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Detekt reports false positives on the formatter rules without the
    // formatting plugin loaded; keeping this in sync with the detekt
    // version in the root project.
    detektPlugins 'io.gitlab.arturbosch.detekt:detekt-formatting:1.23.7'
}