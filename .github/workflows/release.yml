name: Release

# Tag-triggered release pipeline. Push a tag like v1.2.3 and this workflow
# will:
#   1. Compile a release APK (running tests + detekt as part of assemble).
#   2. Sign it with the production keystore if KEYSTORE_BASE64 et al. are
#      configured as repository secrets. Otherwise the workflow fails with
#      a clear error rather than publishing an unsigned APK that won't
#      install on a phone.
#   3. Verify the signature with apksigner.
#   4. Create a GitHub Release with auto-generated release notes and the
#      signed APK attached.
#
# Manual dispatch is also supported for ad-hoc builds — pick a version
# string when you fire it and it tags + releases for you.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v, e.g. 1.2.3). Will create a tag.'
        required: true
        type: string

permissions:
  contents: write  # Required to create GitHub Releases and push tags.

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release  # Use the `release` environment for keystore secrets + required reviewers.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for auto-generated release notes (git log since last tag).

      - name: Resolve version
        id: version
        # Either we were triggered by a tag (use it directly) or by
        # workflow_dispatch (the user typed a version — we'll tag it
        # in a later step).
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (version ${VERSION})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Bump versionCode + versionName in app/build.gradle
        # Patches the source on disk for this build only (we don't push
        # the change back). versionCode = epoch seconds gives a
        # monotonically increasing integer that Play Store / sideloads
        # will treat as "newer".
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE=$(date +%s)
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${VERSION}\"/" app/build.gradle
          echo "versionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          grep -E "versionCode|versionName" app/build.gradle

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate Android SDK build-tools
        id: build-tools
        # apksigner lives under the highest-version build-tools dir.
        # We resolve it once so the next two steps can use the same
        # binary.
        run: |
          BT_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          echo "path=${BT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Using build-tools at ${BT_DIR}"

      - name: Sign release APK
        # Signing is gated on KEYSTORE_BASE64 being present. If a fork
        # runs this workflow without the secrets set, we fail loudly
        # rather than publishing an unsigned APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Configure release signing — see README." >&2
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > keystore.jks
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/droidal-${{ steps.version.outputs.version }}.apk
          "${{ steps.build-tools.outputs.path }}apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED}" \
            "${UNSIGNED}"
          "${{ steps.build-tools.outputs.path }}apksigner" verify --verbose "${SIGNED}"
          # Clean up so the keystore can't accidentally leak into an artifact.
          rm -f keystore.jks
          echo "SIGNED_APK=${SIGNED}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        # Markdown-formatted changelog from commits since the previous
        # tag. We exclude merge commits to keep the list readable.
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || echo "")
          {
            echo "## Droidal ${{ steps.version.outputs.tag }}"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              echo "### Changes since ${PREV_TAG}"
              echo
              git log "${PREV_TAG}..${{ steps.version.outputs.tag }}" \
                --pretty=format:"- %s (%h)" --no-merges || true
            else
              echo "### Initial release"
              echo
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi
            echo
            echo
            echo "### Install"
            echo
            echo "Download \`droidal-${{ steps.version.outputs.version }}.apk\` below and sideload it on Android 12+ (S23 is the primary target)."
          } > release-notes.md
          cat release-notes.md

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${SIGNED_APK}" \
            --title "Droidal ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidal-${{ steps.version.outputs.version }}-signed
          path: app/build/outputs/apk/release/droidal-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90
