name: CodeQL

# Static security analysis for Kotlin / Java source. Runs on pushes to
# main, on every PR (so you see findings before merge), and weekly so
# we catch new rule additions even on quiet weeks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'  # Mondays at 04:37 UTC — off-peak.

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to the Security tab.
  actions: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # security-extended adds a broader set of queries than the
          # default. Cost is a few extra minutes; well worth it for an
          # app that handles API keys and audio input.
          queries: security-extended

      - name: Build (for CodeQL to trace)
        # CodeQL needs to observe a real compile of the project to build
        # its database — :app:assembleDebug is the canonical build.
        run: ./gradlew :app:assembleDebug --stacktrace -x test -x detekt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
